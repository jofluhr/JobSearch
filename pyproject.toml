[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Daily job discovery: collects postings, merges duplicates into jobs and scores them against a candidate profile."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "win11toast>=0.35; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]
# Career pages that only show jobs after JavaScript runs. Then: playwright install chromium
browser = ["playwright>=1.40"]
# Tracing into a local Phoenix, see TRACING_ENDPOINT in .env.example
trace = ["opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobsearch = ["migrations/*.sql", "prompts/*.md", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
